version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
  # The root pnpm workspace updater includes backend/salonbw-backend and updates
  # both its package.json and pnpm-lock.yaml. A second nested npm updater
  # creates duplicate, lockfile-incomplete PRs that cannot pass frozen CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    ignore:
      # Dependabot npm/yarn updater cannot resolve pnpm workspace link: deps
      - dependency-name: "axios"
      - dependency-name: "glob"
      - dependency-name: "js-yaml"
      - dependency-name: "next"
