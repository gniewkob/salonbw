version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10

  # The root pnpm workspace updater includes backend/salonbw-backend and
  # updates its package.json together with pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10

    # Major version upgrades require coordinated migration and DEV validation.
    # GitHub documents that this applies only to version updates; security
    # updates remain eligible, including security fixes requiring a new major.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    # Group compatible PATCH upgrades, not minor/major changes. Development
    # and production dependencies stay separate for risk-based review.
    groups:
      development-patches:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "patch"
      runtime-patches:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    ignore:
      # Dependabot npm/yarn updater cannot resolve pnpm workspace link: deps
      - dependency-name: "axios"
      - dependency-name: "glob"
      - dependency-name: "js-yaml"
      - dependency-name: "next"
      # Coordinate major upgrades separately; security updates stay enabled.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
