          PGUSER_VAL: ${{ secrets.PGUSER }}
          PGPASSWORD_VAL: ${{ secrets.PGPASSWORD }}
          PGDATABASE_VAL: ${{ secrets.PGDATABASE }}
        run: |
          node scripts/ci/write-api-env.mjs

          # Upload the generated base .env (without SMTP credentials).
          # SMTP_* must be set directly on the server and is preserved across deploys.
          rsync -az --timeout=300 -e "ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" .env.production \
            vetternkraft@s0.mydevil.net:${{ steps.dest.outputs.remote_path_api }}/.env.generated

          # Merge server-side to preserve all existing runtime keys in .env.
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net <<'REMOTE_CMDS'
          set -euo pipefail
          REMOTE_PATH='${{ steps.dest.outputs.remote_path_api }}'
          cd "$REMOTE_PATH"
          touch .env
          # Replace only keys present in .env.generated; keep all other existing keys.
          awk -F= '
            function trim(s) {
              sub(/^[[:space:]]+/, "", s);
              sub(/[[:space:]]+$/, "", s);
              return s;
            }
            NR == FNR {
              if ($0 ~ /^[[:space:]]*#/ || $0 !~ /=/) next;
              key = trim($1);
              generated[key] = $0;
              order[++generatedCount] = key;
              next;
            }
            {
              if ($0 ~ /^[[:space:]]*#/ || $0 !~ /=/) {
                print $0;
                next;
              }
              key = trim($1);
              if (key in generated) {
                print generated[key];
                seen[key] = 1;
              } else {
                print $0;
              }
            }
            END {
              for (i = 1; i <= generatedCount; i++) {
                key = order[i];
                if (!(key in seen)) {
                  print generated[key];
                }
              }
            }
          ' .env.generated .env > .env.new
          mv .env.new .env
          rm -f .env.generated
          chmod 600 .env
          REMOTE_CMDS

      - name: Validate DB connectivity (api)
