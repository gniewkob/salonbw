          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
        run: node scripts/ci/warmup-app.mjs

      - name: Restart app (landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' && steps.dest.outputs.prepare_only != 'true' }}
        run: |
          APP_NAME="${{ steps.dest.outputs.app_name_public }}"
          echo "Restarting $APP_NAME (Passenger)..."
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "if devil www restart '$APP_NAME'; then echo 'Restarted via devil'; else echo 'devil restart failed, touching domain restart.txt'; touch /usr/home/vetternkraft/domains/$APP_NAME/public_nodejs/tmp/restart.txt; fi"

      - name: Warm up + verify (landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' && steps.dest.outputs.prepare_only != 'true' }}
        env:
          APP_URL: https://${{ steps.dest.outputs.app_name_public }}/
          APP_RELEASE: ${{ steps.source.outputs.sha }}
          FRONTEND_ENVIRONMENT: ${{ steps.dest.outputs.frontend_environment }}
          API_PROXY_URL: ${{ steps.dest.outputs.proxy_url }}
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
        run: node scripts/ci/warmup-app.mjs

      - name: Sanitize app host (frontend)
        if: ${{ steps.ssh.outcome == 'success' && (steps.dest.outputs.deploy_landing == 'true') }}
        id: host
        shell: bash
        run: |
          APP="${{ steps.dest.outputs.app_name_public }}"; APP=${APP//\'/}; APP=${APP//\"/}; echo "app=$APP" >> "$GITHUB_OUTPUT"; echo "Host=$APP"

      - name: Record preparation boundary
        if: ${{ steps.dest.outputs.prepare_only == 'true' }}
        run: echo 'Canonical landing files prepared. No domain activation or live success is claimed.' >> "$GITHUB_STEP_SUMMARY"
