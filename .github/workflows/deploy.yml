      - name: Install private frontend runtime
        if: ${{ steps.dest.outputs.deploy_landing == 'true' || steps.dest.outputs.deploy_panel == 'true' }}
        env:
          APP_RELEASE: ${{ steps.source.outputs.sha }}
          FRONTEND_ENVIRONMENT: ${{ steps.dest.outputs.frontend_environment }}
          API_PROXY_URL: ${{ steps.dest.outputs.proxy_url }}
          AUTH_COOKIE_PREFIX: ${{ steps.dest.outputs.auth_cookie_prefix }}
          LANDING_URL: ${{ steps.dest.outputs.landing_url }}
          PANEL_URL: ${{ steps.dest.outputs.panel_url }}
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const e = process.env;
          const dev = e.FRONTEND_ENVIRONMENT === 'development';
          if (dev && (!e.DEV_ACCESS_USER || !e.DEV_ACCESS_PASSWORD)) throw new Error('Missing development access');
          const values = { NODE_ENV: 'production', APP_ENV: e.FRONTEND_ENVIRONMENT, APP_RELEASE: e.APP_RELEASE, API_PROXY_URL: e.API_PROXY_URL, NEXT_PUBLIC_DEPLOYMENT_ENV: e.FRONTEND_ENVIRONMENT, NEXT_PUBLIC_AUTH_COOKIE_PREFIX: e.AUTH_COOKIE_PREFIX, NEXT_PUBLIC_LANDING_URL: e.LANDING_URL, NEXT_PUBLIC_PANEL_URL: e.PANEL_URL };
          if (dev) Object.assign(values, { DEV_ACCESS_USER: e.DEV_ACCESS_USER, DEV_ACCESS_PASSWORD: e.DEV_ACCESS_PASSWORD });
          fs.writeFileSync('.frontend-runtime.json', JSON.stringify(values), { mode: 0o600 });
          fs.chmodSync('.frontend-runtime.json', 0o600);
          NODE
          for spec in 'landing:${{ steps.dest.outputs.remote_path_public }}:${{ steps.dest.outputs.deploy_landing }}' 'panel:${{ steps.dest.outputs.remote_path_panel }}:${{ steps.dest.outputs.deploy_panel }}'; do
            IFS=: read -r app remote enabled <<< "$spec"
            [ "$enabled" = true ] || continue
            rsync -az --timeout=300 -e "ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" .frontend-runtime.json "vetternkraft@s0.mydevil.net:$remote/.env.runtime.json"
            ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "REMOTE_PATH='$remote' FRONTEND_ENVIRONMENT='$FRONTEND_ENVIRONMENT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH"
          chmod 600 .env.runtime.json
          if [ "$FRONTEND_ENVIRONMENT" = development ]; then
            mkdir -p .diagnostics
            chmod 700 .diagnostics
            for legacy in .env .env.production .env.local .env.production.local; do
              if [ -f "$legacy" ] && [ ! -L "$legacy" ]; then
                private="$HOME/.deployment-private/legacy-frontend-env/${REMOTE_PATH##*/}"
                mkdir -p "$private"
                chmod 700 "$HOME/.deployment-private" "$HOME/.deployment-private/legacy-frontend-env" "$private"
                saved="$private/$legacy.pre-isolation.$(date +%s).$$"
                mv "$legacy" "$saved"
                chmod 600 "$saved"
              fi
            done
          fi
          REMOTE
          done
          rm -f .frontend-runtime.json

      - name: Prepare standalone runtime (set node version) (panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' }}
