name: Deploy (MyDevil)
run-name: Deploy ${{ inputs.environment || 'staging' }} ${{ inputs.target || 'unspecified' }} ${{ inputs.ref || github.sha }}

concurrency:
  # Serialize deployment operations per destination, even from different refs.
  group: salonbw-deploy-${{ inputs.environment || 'invalid' }}
  cancel-in-progress: false

on:
  # Production must never deploy as a side-effect of merging to master.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA)
        required: true
        default: master
      target:
        description: What to deploy. Canonical => landing|panel|api|all|probe. Aliases => public=landing, dashboard=panel, admin=panel.
        required: true
        default: landing
        type: choice
        options:
          - landing
          - panel
          - api
          - all
          - frontends
          - probe
          - public
          - dashboard
          - admin
      environment:
        description: Deployment environment; explicit promotion required
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      prepare_only:
        description: Prepare canonical landing files without activation or live verification
        type: boolean
        required: false
        default: false
      api_url:
        description: Public API URL used at build time (leave empty to use environment defaults)
        required: false
        default: ""
      remote_path:
        description: Remote path (e.g., /home/<user>/domains/<domain>/public_nodejs). If empty, repo variables will be used.
        required: false
        default: ""
      app_name:
        description: MyDevil app name for restart. If empty, repo variables will be used.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  PNPM_VERSION: 10.14.0
  NODE_VERSION: "22"

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'probe' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Probe Server
        env:
          MYDEVIL_SSH_HOST: ${{ secrets.MYDEVIL_SSH_HOST }}
          MYDEVIL_SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MYDEVIL_KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          KEY_CONTENT="${MYDEVIL_SSH_KEY:-$SSH_PRIVATE_KEY}"
          if printf "%s" "$KEY_CONTENT" | grep -q -e "-----BEGIN "; then
            printf "%s" "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/mydevil
          else
            printf "%s" "$KEY_CONTENT" | tr -d '\r' | base64 -d > ~/.ssh/mydevil || printf "%s" "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/mydevil
          fi
          chmod 600 ~/.ssh/mydevil

          echo "=== ls -la apps/nodejs/panelbw ==="
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "ls -la apps/nodejs/panelbw" || true

          echo "=== ls -la apps/nodejs/panelbw/.next/server/pages ==="
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "ls -la apps/nodejs/panelbw/.next/server/pages" || true

          echo "=== Check Symlink public_nodejs ==="
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "ls -la domains/panel.salon-bw.pl/public_nodejs" || true

          echo "=== Check Redirect Logic (index.js) ==="
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "grep -i 'Dashboard' apps/nodejs/panelbw/.next/server/pages/index.js" || echo "Grep failed or no match"

  deploy:
    # No implicit deployments from merge, push, scheduled events or reuse.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'probe' }}
    name: Deploy ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    # The GitHub environment and resolved paths must describe the same target.
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      # Pass through for steps to use comfortably
    steps:
      - name: Resolve immutable source commit
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.REQUESTED_REF,
            });
            core.setOutput('sha', data.sha);

      - name: Checkout
        uses: actions/checkout@v5 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          # github.event.before may be many commits behind when a push contains
          # multiple commits. Keep the complete graph so path detection does
          # not misclassify that normal push as a force-push.
          fetch-depth: 0

      - name: Wait for successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/wait-for-ci-success.sh "${{ steps.source.outputs.sha }}"

      - name: Detect changes
        if: ${{ github.event_name == 'push' }}
        id: changes
        shell: bash
        run: |
          scripts/ci/detect-deploy-changes.sh \
            "${{ github.event.before }}" \
            "${{ github.sha }}"

      # Input validation intentionally omitted due to quoting issues in GitHub runner

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load optional variables
        shell: bash
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          # Extract optional variables dynamically to bypass linter checks
          node -e '
            const vars = JSON.parse(process.env.VARS_JSON || "{}");
            const keys = [
              "SMOKE_EMAIL_TO"
            ];
            const fs = require("fs");
            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              keys.forEach(k => {
                // write to GITHUB_ENV
                fs.appendFileSync(envFile, `${k}=${vars[k] || ""}\n`);
              });
            }
          '

      - name: Resolve deploy destination
        id: dest
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REMOTE_PATH: ${{ github.event.inputs.remote_path }}
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          PREPARE_ONLY: ${{ github.event.inputs.prepare_only || 'false' }}
          CHANGED_LANDING: ${{ steps.changes.outputs.landing }}
          CHANGED_PANEL: ${{ steps.changes.outputs.panel }}
          CHANGED_API: ${{ steps.changes.outputs.api }}
        run: node scripts/ci/deployment-config.mjs

      - name: Validate development configuration
        env:
          FRONTEND_ENVIRONMENT: ${{ steps.dest.outputs.frontend_environment }}
          DEPLOY_API: ${{ steps.dest.outputs.deploy_api }}
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          DEV_DB_USER: ${{ vars.DEV_DB_USER }}
          DEV_DB_NAME: ${{ vars.DEV_DB_NAME }}
          DEV_DB_HOST: ${{ vars.DEV_DB_HOST }}
          DEV_DB_PASS: ${{ secrets.MYDEVIL_DEV_DB_PASSWORD }}
          DEV_JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          DEV_JWT_REFRESH_SECRET: ${{ secrets.DEV_JWT_REFRESH_SECRET }}
        run: |
          node <<'NODE'
          if (process.env.FRONTEND_ENVIRONMENT === 'development') {
            const fields = ['DEV_ACCESS_USER', 'DEV_ACCESS_PASSWORD'];
            if (process.env.DEPLOY_API === 'true') fields.push('DEV_DB_USER', 'DEV_DB_NAME', 'DEV_DB_HOST', 'DEV_DB_PASS', 'DEV_JWT_SECRET', 'DEV_JWT_REFRESH_SECRET');
            for (const field of fields) if (!process.env[field]) throw new Error('Missing development configuration: ' + field);
          }
          NODE

      - name: Build frontend (Landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' }}
        run: |
          rm -rf apps/landing/.next
          pnpm --filter @salonbw/landing build
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.dest.outputs.api_url }}
          NEXT_PUBLIC_PANEL_URL: ${{ steps.dest.outputs.panel_url }}
          API_PROXY_URL: ${{ steps.dest.outputs.proxy_url }}
          NEXT_PUBLIC_DEPLOYMENT_ENV: ${{ steps.dest.outputs.frontend_environment }}
          NEXT_PUBLIC_AUTH_COOKIE_PREFIX: ${{ steps.dest.outputs.auth_cookie_prefix }}
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.DEPLOY_ENV == 'production' && vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          # Canonical site: drives canonical URLs, the sitemap, and which
          # host is allowed to be indexed. Deliberately NOT the host that
          # currently serves the build (dev.), so the copy stays out of the
          # index until the cutover moves the landing to salon-bw.pl.
          NEXT_PUBLIC_SITE_URL: ${{ steps.dest.outputs.landing_url }}

      - name: Read BUILD_ID (frontend)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' || steps.dest.outputs.deploy_panel == 'true' }}
        id: buildid
        shell: bash
        run: |
          if [ -f apps/panel/.next/BUILD_ID ]; then
            echo "id=$(cat apps/panel/.next/BUILD_ID)" >> "$GITHUB_OUTPUT"
          elif [ -f apps/landing/.next/BUILD_ID ]; then
            echo "id=$(cat apps/landing/.next/BUILD_ID)" >> "$GITHUB_OUTPUT"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend
        if: ${{ steps.dest.outputs.deploy_api == 'true' }}
        run: |
          cd backend/salonbw-backend
          # Dependencies already installed via pnpm workspace in previous step
          pnpm run build
          # Explicitly compile migrate.ts as it might be missed by nest build
          echo "Explicitly building migrate.ts..."
          pnpm exec tsc src/migrate.ts --outDir dist --skipLibCheck --esModuleInterop --target ES2022 --module node16 || echo "tsc failed but continuing..."
          ls -l dist/migrate.js || echo "migrate.js missing!"

      - name: Configure SSH
        id: ssh
        run: |
          mkdir -p ~/.ssh
          KEY_CONTENT="${MYDEVIL_SSH_KEY:-$SSH_PRIVATE_KEY}"
          if printf "%s" "$KEY_CONTENT" | grep -q -e "-----BEGIN "; then
            printf "%s" "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/mydevil
          else
            printf "%s" "$KEY_CONTENT" | tr -d '\r' | base64 -d > ~/.ssh/mydevil || printf "%s" "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/mydevil
          fi
          chmod 600 ~/.ssh/mydevil
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/mydevil
          if [ -n "$MYDEVIL_KNOWN_HOSTS" ]; then
            printf "%s\n" "$MYDEVIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$MYDEVIL_SSH_HOST" >> ~/.ssh/known_hosts
          fi
        env:
          MYDEVIL_SSH_HOST: ${{ secrets.MYDEVIL_SSH_HOST }}
          MYDEVIL_SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MYDEVIL_KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}

      - name: 🔍 Verify SSH Connectivity
        run: |
          echo "============================================"
          echo "🚀 STEP: Verifying SSH connectivity"
          echo "============================================"

          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            vetternkraft@s0.mydevil.net "echo '✅ SSH connection successful'" || {
            echo "❌ SSH connection failed (exec channel)"
            echo ""
            echo "============================================"
            echo "🔎 DIAGNOSTIC: exec failed — probing whether this"
            echo "   is SFTP-only mode (account-level SSH access"
            echo "   restriction) vs a full lockout. Read-only,"
            echo "   changes nothing on the remote."
            echo "============================================"
            if echo "pwd" | sftp -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -i ~/.ssh/mydevil -b - vetternkraft@s0.mydevil.net 2>&1; then
              echo ""
              echo "👉 SFTP subsystem WORKS while exec/shell is rejected."
              echo "   This is the standard signature of the MyDevil"
              echo "   account being switched to \"SFTP only\" SSH access."
              echo "   Fix: MyDevil panel (panel.mydevil.net) → this"
              echo "   account → SSH access → switch back to full"
              echo "   shell/exec access (or contact MyDevil support if"
              echo "   the toggle isn't available). This cannot be fixed"
              echo "   from CI/CD — it requires the hosting account owner."
            else
              echo ""
              echo "👉 SFTP ALSO failed — this is not SFTP-only mode,"
              echo "   the account/key has no working access at all"
              echo "   (suspended account, revoked key, or IP block)."
              echo "   Fix: check account status directly in the MyDevil"
              echo "   panel, or contact MyDevil support."
            fi
            exit 1
          }

          echo ""
          echo "============================================"
          echo "✅ SSH connectivity verified"
          echo "============================================"

      - name: 🏗️ Build frontend (Panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' }}
        run: |
          echo "============================================"
          echo "🚀 STEP: Building Panel frontend"
          echo "============================================"
          set -x  # Enable verbose debugging
          set -o pipefail
          echo "=== DEBUG: Environment variables ==="
          echo "NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"
          echo "API_PROXY_URL: $API_PROXY_URL"
          echo "DATABASE_URL: ${DATABASE_URL:+ [SET]}"
          echo "NODE_VERSION: $(node --version)"
          echo "PNPM_VERSION: $(pnpm --version)"
          echo ""
          echo "=== DEBUG: Starting build ==="
          rm -rf apps/panel/.next
          pnpm --filter @salonbw/panel --fail-if-no-match build 2>&1 | tee build.log || {
            echo ""
            echo "❌ BUILD FAILED - Last 50 lines of output:" 
            tail -50 build.log
            exit 1
          }
          echo ""
          echo "✅ Build completed successfully"
          echo "Listing .next directory RECURSIVE (Debug):"
          ls -R apps/panel/.next || echo "apps/panel/.next NOT FOUND"
          echo "Listing Standalone App Dir:"
          ls -R apps/panel/.next/standalone/apps || echo "standalone/apps NOT FOUND"
          echo ""
          echo "============================================"
          echo "✅ Panel frontend build completed"
          echo "============================================"
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.dest.outputs.api_url }}
          API_PROXY_URL: ${{ steps.dest.outputs.proxy_url }}
          NEXT_PUBLIC_DEPLOYMENT_ENV: ${{ steps.dest.outputs.frontend_environment }}
          NEXT_PUBLIC_AUTH_COOKIE_PREFIX: ${{ steps.dest.outputs.auth_cookie_prefix }}
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          NEXT_PANEL_HTML_NOSTORE: "true"
          # Error monitoring: empty until the owner sets the repo/Env var, then
          # the next panel build bakes it in and Sentry activates (sentry.client
          # no-ops on an empty DSN). Set NEXT_PUBLIC_SENTRY_DSN as a GitHub var.
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.DEPLOY_ENV == 'production' && vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          # Social login: set to "true" once GOOGLE_CLIENT_ID/SECRET are on the
          # API .env, so the "Continue with Google" button only shows when it works.
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ env.DEPLOY_ENV == 'staging' && 'false' || vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
          # Where the panel links for legal pages and after logout. Stays on
          # the dev landing until the domain cutover sets the repo var
          # LANDING_PUBLIC_URL=https://salon-bw.pl (docs/DOMAIN_CUTOVER_PLAN.md).
          NEXT_PUBLIC_LANDING_URL: ${{ steps.dest.outputs.landing_url }}

      - name: Ensure remote directories exist (landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' }}
        run: |
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net \
            "bash -s -- '${{ steps.dest.outputs.app_name_public }}' '${{ steps.dest.outputs.remote_path_public }}'" < scripts/mydevil/ensure-app-symlink.sh

      - name: Ensure remote directories exist (panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' }}
        run: |
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net \
            "bash -s -- '${{ steps.dest.outputs.app_name_panel }}' '${{ steps.dest.outputs.remote_path_panel }}'" < scripts/mydevil/ensure-app-symlink.sh

      - name: Upload frontend bundle (panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' }}
        env:
          APP_RELEASE: ${{ steps.source.outputs.sha }}
          FRONTEND_ENVIRONMENT: ${{ steps.dest.outputs.frontend_environment }}
          UPSTREAM_API: ${{ steps.dest.outputs.proxy_url }}
        run: |
          set -euo pipefail
          DEST="${{ steps.dest.outputs.remote_path_panel }}"
          APP_NAME="${{ steps.dest.outputs.app_name_panel }}"
          TARGET_APP="apps/panel"
          REMOTE_ROOT="/usr/home/vetternkraft"
          REMOTE_DEST="${REMOTE_ROOT}/${DEST}"
          echo "Targeting PANEL: $DEST"

          BUNDLE_DIR="deploy_bundle_panel"
          TAR_NAME="deploy_panel.tar.gz"

          echo "Bundling Application from $TARGET_APP (Clean Install Strategy)..."

          rm -rf "$BUNDLE_DIR" "$TAR_NAME"
          mkdir -p "$BUNDLE_DIR/.next" "$BUNDLE_DIR/public"

          test -d "$TARGET_APP/.next"
          test -d "$TARGET_APP/public"
          test -f "$TARGET_APP/package.json"
          if [ ! -f "$TARGET_APP/app.js" ] && [ ! -f "$TARGET_APP/app.cjs" ]; then
            echo "::error::$TARGET_APP missing app.js/app.cjs (Passenger entrypoint)"
            exit 1
          fi

          # STANDARD BUILD STRATEGY (Non-Standalone)
          # Copy everything necessary for runtime
          cp -r "$TARGET_APP/.next" "$BUNDLE_DIR/"
          cp -r "$TARGET_APP/public" "$BUNDLE_DIR/"
          cp "$TARGET_APP/package.json" "$BUNDLE_DIR/"
          cp "$TARGET_APP/next.config.mjs" "$BUNDLE_DIR/"

          # Ensure font manifest exists (Next.js expects this file at runtime)
          if [ ! -f "$BUNDLE_DIR/.next/server/font-manifest.json" ]; then
             mkdir -p "$BUNDLE_DIR/.next/server"
             echo "[]" > "$BUNDLE_DIR/.next/server/font-manifest.json"
          fi

          # Copy app.js (Passenger Entry Point)
          if [ -f "$TARGET_APP/app.js" ]; then
             cp "$TARGET_APP/app.js" "$BUNDLE_DIR/"
          fi
          if [ -f "$TARGET_APP/app.cjs" ]; then
             cp "$TARGET_APP/app.cjs" "$BUNDLE_DIR/"
          fi

          # NOTE: historically .next/static was hard-copied into public/_next
          # so MyDevil's nginx served it directly (fix for Passenger 404s from
          # before app.cjs created the static symlink). That bypass stripped
          # Next's `Cache-Control: immutable` — every fingerprinted JS/CSS/font
          # was re-downloaded on each visit (TTL 0). Node's standalone server
          # handles /_next/static itself (verified: missing-file requests fall
          # through nginx to Node), so the copy is gone and correct caching is
          # back.

          # Copy source files (middleware needs src structure?)
          mkdir -p "$BUNDLE_DIR/src"
          if [ -f "$TARGET_APP/src/middleware.ts" ]; then
             cp "$TARGET_APP/src/middleware.ts" "$BUNDLE_DIR/src/"
          fi

          if [ -d "$TARGET_APP/scripts" ]; then
             cp -r "$TARGET_APP/scripts" "$BUNDLE_DIR/"
          fi

          # Copy local packages (dependencies)
          mkdir -p "$BUNDLE_DIR/packages"
          if [ -d "packages/api" ]; then
             cp -r packages/api "$BUNDLE_DIR/packages/"
          fi

          # Rewrite workspace links to local file paths for remote npm install
          echo "Rewriting package links for remote install..."
          cd "$BUNDLE_DIR"

          # Fix: Remove local workspace links (e.g. "link:../../packages/api") from package.json
          # These are already bundled by Next.js Standalone, and npm install won't resolve them.
          # Fix: Rewrite workspace links to local file paths
          sed -i 's|link:../../packages/api|file:./packages/api|g' package.json
          sed -i '/workspace:/d' package.json

          # Reduce transfer payload: cache is not required at runtime
          rm -rf .next/cache
          cd ..

          test -d "$BUNDLE_DIR/.next"
          test -d "$BUNDLE_DIR/public"

          # Create Tarball
          node scripts/ci/frontend-release-metadata.mjs "$BUNDLE_DIR"
          tar -czf "$TAR_NAME" -C "$BUNDLE_DIR" .
          echo "Tarball contents (top):"
          # tar may exit non-zero on SIGPIPE when piped into head; ignore for debug listing.
          tar -tzf "$TAR_NAME" | head -n 40 || true

          # 2. Upload Tarball
          # 2. Upload Tarball
          # 2. Upload Tarball
          echo "Uploading Bundle to $DEST..."
          ls -la "$TAR_NAME"
          timeout 900 rsync -az --timeout=120 \
            -e "ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            "$TAR_NAME" vetternkraft@s0.mydevil.net:"$REMOTE_DEST/deploy.tar.gz"

          # 3. Extract and Clean (robust against NFS/.nfs* leftovers)
          # The helper rolls back a failed extract and keeps the immediately
          # previous fingerprinted assets for already-open browser tabs.
          echo "Extracting Bundle..."
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            vetternkraft@s0.mydevil.net "bash -s -- '$REMOTE_DEST'" \
            < scripts/mydevil/extract-frontend-bundle.sh

      - name: Upload frontend bundle (landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' }}
        env:
          APP_RELEASE: ${{ steps.source.outputs.sha }}
          FRONTEND_ENVIRONMENT: ${{ steps.dest.outputs.frontend_environment }}
          UPSTREAM_API: ${{ steps.dest.outputs.proxy_url }}
        run: |
          set -euo pipefail
          DEST="${{ steps.dest.outputs.remote_path_public }}"
          APP_NAME="${{ steps.dest.outputs.app_name_public }}"
          TARGET_APP="apps/landing"
          REMOTE_ROOT="/usr/home/vetternkraft"
          # The resolver emits a verified path relative to the account home.
          REMOTE_DEST="${REMOTE_ROOT}/${DEST}"
          echo "Targeting LANDING: $DEST"

          BUNDLE_DIR="deploy_bundle_landing"
          TAR_NAME="deploy_landing.tar.gz"

          echo "Bundling Application from $TARGET_APP (Clean Install Strategy)..."

          rm -rf "$BUNDLE_DIR" "$TAR_NAME"
          mkdir -p "$BUNDLE_DIR/.next" "$BUNDLE_DIR/public"

          test -d "$TARGET_APP/.next"
          test -d "$TARGET_APP/public"
          test -f "$TARGET_APP/package.json"
          if [ ! -f "$TARGET_APP/app.js" ] && [ ! -f "$TARGET_APP/app.cjs" ]; then
            echo "::error::$TARGET_APP missing app.js/app.cjs (Passenger entrypoint)"
            exit 1
          fi

          # STANDARD BUILD STRATEGY (Non-Standalone)
          # Copy everything necessary for runtime
          cp -r "$TARGET_APP/.next" "$BUNDLE_DIR/"
          cp -r "$TARGET_APP/public" "$BUNDLE_DIR/"
          cp "$TARGET_APP/package.json" "$BUNDLE_DIR/"
          cp "$TARGET_APP/next.config.mjs" "$BUNDLE_DIR/"

          # Ensure font manifest exists (Next.js expects this file at runtime)
          if [ ! -f "$BUNDLE_DIR/.next/server/font-manifest.json" ]; then
             mkdir -p "$BUNDLE_DIR/.next/server"
             echo "[]" > "$BUNDLE_DIR/.next/server/font-manifest.json"
          fi

          # Copy app.js (Passenger Entry Point)
          if [ -f "$TARGET_APP/app.js" ]; then
             cp "$TARGET_APP/app.js" "$BUNDLE_DIR/"
          fi
          if [ -f "$TARGET_APP/app.cjs" ]; then
             cp "$TARGET_APP/app.cjs" "$BUNDLE_DIR/"
          fi

          # NOTE: historically .next/static was hard-copied into public/_next
          # so MyDevil's nginx served it directly (fix for Passenger 404s from
          # before app.cjs created the static symlink). That bypass stripped
          # Next's `Cache-Control: immutable` — every fingerprinted JS/CSS/font
          # was re-downloaded on each visit (TTL 0). Node's standalone server
          # handles /_next/static itself (verified: missing-file requests fall
          # through nginx to Node), so the copy is gone and correct caching is
          # back.

          # Copy source files (middleware needs src structure?)
          mkdir -p "$BUNDLE_DIR/src"
          if [ -f "$TARGET_APP/src/middleware.ts" ]; then
             cp "$TARGET_APP/src/middleware.ts" "$BUNDLE_DIR/src/"
          fi

          if [ -d "$TARGET_APP/scripts" ]; then
             cp -r "$TARGET_APP/scripts" "$BUNDLE_DIR/"
          fi

          # Copy local packages (dependencies)
          mkdir -p "$BUNDLE_DIR/packages"
          if [ -d "packages/api" ]; then
             cp -r packages/api "$BUNDLE_DIR/packages/"
          fi

          # Rewrite workspace links to local file paths for remote npm install
          echo "Rewriting package links for remote install..."
          cd "$BUNDLE_DIR"

          # Fix: Remove local workspace links (e.g. "link:../../packages/api") from package.json
          # These are already bundled by Next.js Standalone, and npm install won't resolve them.
          # Fix: Rewrite workspace links to local file paths
          sed -i 's|link:../../packages/api|file:./packages/api|g' package.json
          sed -i '/workspace:/d' package.json

          # Reduce transfer payload: cache is not required at runtime
          rm -rf .next/cache
          cd ..

          test -d "$BUNDLE_DIR/.next"
          test -d "$BUNDLE_DIR/public"

          # Create Tarball
          node scripts/ci/frontend-release-metadata.mjs "$BUNDLE_DIR"
          tar -czf "$TAR_NAME" -C "$BUNDLE_DIR" .
          echo "Tarball contents (top):"
          tar -tzf "$TAR_NAME" | head -n 40 || true

          # Upload Tarball
          echo "Uploading Bundle to $DEST..."
          ls -la "$TAR_NAME"
          timeout 900 rsync -az --timeout=120 \
            -e "ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            "$TAR_NAME" vetternkraft@s0.mydevil.net:"$REMOTE_DEST/deploy.tar.gz"

          # Extract and Clean (robust against NFS/.nfs* leftovers)
          echo "Extracting Bundle..."
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            vetternkraft@s0.mydevil.net "bash -s -- '$REMOTE_DEST'" \
            < scripts/mydevil/extract-frontend-bundle.sh

      - name: Install dependencies (frontend panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' }}
        run: |
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=no vetternkraft@s0.mydevil.net "REMOTE_PATH='${{ steps.dest.outputs.remote_path_panel }}' bash -s" <<'SSH'
          set -euo pipefail
          cd "$REMOTE_PATH"
          install_cmd="npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --loglevel=error"
          if command -v npm22 >/dev/null 2>&1; then
            install_cmd="npm22 install --omit=dev --ignore-scripts --no-package-lock --no-audit --loglevel=error"
          fi
          for attempt in 1 2 3; do
            if eval "$install_cmd"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done
          test -d node_modules
          # Verify critical SSR packages have their package.json. Catches
          # partial tarball extraction (e.g. 2026-06-01: @sentry/core had
          # build/ files but no manifest → MODULE_NOT_FOUND on every SSR page
          # that imports it). Narrow allow-list avoids false positives from
          # legitimately empty scope dirs or globbing quirks under set -e.
          fail=0
          for pkg in @sentry/core @sentry/nextjs @sentry/node-core @sentry/react next react react-dom; do
            if [ -d "node_modules/$pkg" ] && [ ! -f "node_modules/$pkg/package.json" ]; then
              echo "Install corruption: node_modules/$pkg has no package.json" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          SSH

      - name: Install dependencies (frontend landing)
        if: ${{ steps.dest.outputs.deploy_landing == 'true' }}
        run: |
