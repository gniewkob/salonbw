          set -euo pipefail
          REMOTE_PATH='${{ steps.dest.outputs.remote_path_api }}'
          cd "$REMOTE_PATH"
          if command -v node22 >/dev/null 2>&1; then NODE_BIN=node22; else NODE_BIN=node; fi
          # Resolve the migrate entrypoint by FILE PRESENCE, not `A || B`.
          # The old `node dist/src/migrate.js || node dist/migrate.js` ran the
