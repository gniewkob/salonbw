      - name: Warm up + verify (panel)
        if: ${{ steps.dest.outputs.deploy_panel == 'true' && steps.dest.outputs.prepare_only != 'true' }}
        env:
          APP_URL: https://${{ steps.dest.outputs.app_name_panel }}/
          APP_RELEASE: ${{ steps.source.outputs.sha }}
