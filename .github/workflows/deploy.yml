            MAKE=gmake npm_config_build_from_source=true npm22 rebuild bcrypt
          fi
          node22 -e "const b=require('bcrypt');b.hash('runtime-fixture',4).then(h=>b.compare('runtime-fixture',h)).then(ok=>{if(!ok)process.exit(1);console.log('Native password hashing verified')}).catch(()=>process.exit(1))"
          REMOTE_CMDS

      - name: Generate and Upload .env (api)
        if: ${{ steps.dest.outputs.deploy_api == 'true' }}
        shell: bash
        env:
          # Pass all secrets to the local environment first
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          APP_RELEASE: ${{ steps.source.outputs.sha }}
          DB_USER: ${{ secrets.MYDEVIL_DB_USER }}
