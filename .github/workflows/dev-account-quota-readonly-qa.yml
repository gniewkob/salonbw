name: DEV — FreeBSD disk accounting read-only QA

on:
  push:
    branches:
      - ops/disable-staging-snapshot-pipeline-20261111
    paths:
      - '.github/workflows/dev-account-quota-readonly-qa.yml'
      - 'scripts/ci/check-mydevil-dev-quota.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salonbw-dev-quota-readonly-qa
  cancel-in-progress: true

jobs:
  verify-quota:
    name: Inspect native FreeBSD disk accounting without writes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v5

      - name: Validate quota parser with synthetic fixtures
        run: node --test scripts/ci/check-mydevil-dev-quota.test.cjs

      - name: Configure isolated SSH key (no host modifications)
        shell: bash
        env:
          MYDEVIL_SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MYDEVIL_KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          key_content="${MYDEVIL_SSH_KEY:-${SSH_PRIVATE_KEY:-}}"
          [[ -n "$key_content" ]] || { echo "::error::Missing staging SSH key"; exit 1; }
          if [[ "$key_content" == *"-----BEGIN "* ]]; then
            printf '%s' "$key_content" | tr -d '\r' > ~/.ssh/mydevil
          else
            printf '%s' "$key_content" | tr -d '\r' | base64 -d > ~/.ssh/mydevil
          fi
          chmod 600 ~/.ssh/mydevil
          if [[ -n "$MYDEVIL_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$MYDEVIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H s0.mydevil.net > ~/.ssh/known_hosts
          fi

      - name: Probe FreeBSD native user quota and disk usage (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ssh_read() {
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -i "$HOME/.ssh/mydevil" \
              vetternkraft@s0.mydevil.net "$1"
          }

          if ! ssh_read 'true' >/dev/null 2>&1; then
            echo "::error::FREEBSD_SSH_EXEC_UNAVAILABLE"
            exit 1
          fi

          # Native quota(1) is read-only, but may not represent the
          # contractual MyDevil storage plan.
          quota_status=0
          quota_output="$(ssh_read 'quota -v' 2>&1)" || quota_status=$?

          df_output="$(ssh_read 'df -Pk "$HOME"')" || {
            echo "::error::FREEBSD_DF_FAILED"
            exit 1
          }
          filesystem_free="$(printf '%s\n' "$df_output" | awk 'NR == 2 { print $4 }')"
          [[ "$filesystem_free" =~ ^[0-9]+$ ]] || {
            echo "::error::FREEBSD_DF_INVALID"
            exit 1
          }

          du_status=0
          du_output="$(timeout 90s ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -i "$HOME/.ssh/mydevil" \
            vetternkraft@s0.mydevil.net 'du -sk "$HOME"' 2>/dev/null)" || du_status=$?
          home_used="$(printf '%s\n' "$du_output" | awk 'NR == 1 { print $1 }')"
          if [[ "$du_status" -ne 0 || ! "$home_used" =~ ^[0-9]+$ ]]; then
            home_used=UNAVAILABLE
          fi

          # Extract numeric usage / soft / hard columns, never usernames,
          # filesystem paths or raw remote output.
          numeric="$(printf '%s\n' "$quota_output" | awk '
            /^[[:space:]]*[^[:space:]]+[[:space:]]+[0-9]+[*]?[[:space:]]+[0-9]+[*]?[[:space:]]+[0-9]+[*]?/ {
              used=$2; hard=$4;
              gsub(/[*]/, "", used); gsub(/[*]/, "", hard);
              rows++;
              if (hard+0 > 0) {
                remaining=hard-used;
                if (!has_hard || remaining < min_remaining) min_remaining=remaining;
                has_hard=1;
              }
            }
            END { printf "%d %d %.0f", rows, has_hard ? 1 : 0, has_hard ? min_remaining : -1 }
          ')"
          read -r numeric_rows has_hard_limit quota_remaining <<< "$numeric"
          {
            echo "FREEBSD_READONLY_PROBE=COMPLETE"
            echo "NATIVE_QUOTA_EXIT_STATUS=$quota_status"
            echo "NATIVE_QUOTA_ROWS=$numeric_rows"
            echo "NATIVE_QUOTA_HAS_HARD_LIMIT=$has_hard_limit"
            echo "NATIVE_QUOTA_MIN_REMAINING_KIB=$quota_remaining"
            echo "FILESYSTEM_FREE_KIB=$filesystem_free"
            echo "HOME_DU_USED_KIB=$home_used"
            echo "MYDEVIL_CONTRACTUAL_ACCOUNT_QUOTA=UNVERIFIED"
            echo "NO_SERVER_WRITES=TRUE"
            echo "NO_DEPLOYMENT=TRUE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$quota_status" -ne 0 || "$has_hard_limit" != "1" ]]; then
            echo "::error::NATIVE_QUOTA_UNAVAILABLE: df/du alone cannot verify account quota"
            exit 1
          fi
          if (( quota_remaining < 4194304 || filesystem_free < 4194304 )); then
            echo "::error::FREEBSD_DISK_BELOW_THRESHOLD"
            exit 1
          fi
          echo "::notice::Native quota sufficient; MyDevil plan equivalence remains unverified"
