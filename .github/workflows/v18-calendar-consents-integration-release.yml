name: One-time Calendar V18 DEV HTTP smoke

on:
  push:
    branches:
      - integration/v18-calendar-consents-20261107
    paths:
      - .github/workflows/v18-calendar-consents-integration-release.yml

permissions:
  contents: read

jobs:
  verify-anonymous-routes:
    if: github.repository == 'gniewkob/salonbw'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_RELEASE_SHA: b279bdd5a30a7680ea6a3443ba336c826a5c2581
    steps:
      - name: Verify live release and protected routes without credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const base = 'https://dev-panel.salon-bw.pl';
            const request = (path) => fetch(base + path, {
              redirect: 'manual',
              cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            const release = await request('/__release.json');
            if (release.status !== 200) throw new Error('Release metadata HTTP ' + release.status);
            const metadata = await release.json();
            if (metadata.sha !== process.env.EXPECTED_RELEASE_SHA || metadata.environment !== 'development') {
              throw new Error('Unexpected deployed release/environment');
            }
            console.log('LIVE_SHA=' + metadata.sha);
            for (const path of ['/studio-v18/customers', '/studio-v18/calendar', '/studio-v18/calendar?utm_source=chatgpt.com']) {
              const response = await request(path);
              const location = response.headers.get('location');
              const redirectPath = location ? new URL(location, base).pathname : null;
              console.log(JSON.stringify({path, status: response.status, locationPath: redirectPath}));
              if (![302, 303, 307, 308].includes(response.status) || redirectPath !== '/auth/login') {
                throw new Error('Unexpected anonymous route response: ' + path);
              }
            }
            console.log('LIVE_DEV_ROUTE_GUARDS=PASS');
          })().catch(error => {
            console.error('Smoke FAILED: ' + String(error.message || error));
            process.exitCode = 1;
          });
          NODE
