name: V18 Calendar — postdeploy read-only UAT 2026-11-11

on:
  push:
    branches:
      - qa/v18-postdeploy-calendar-readonly-20261111
    paths:
      - 'apps/panel/uat/hosted-dev-calendar-readonly.pw.ts'
      - 'apps/panel/uat/tsconfig.calendar.json'
      - 'apps/panel/playwright.hosted-dev-calendar.config.ts'
      - '.github/workflows/v18-calendar-postdeploy-readonly-20261111.yml'

permissions:
  contents: read

concurrency:
  group: salonbw-v18-calendar-hosted-readonly
  cancel-in-progress: false

jobs:
  hosted-calendar-readonly:
    name: Verify deployed DEV calendar without writes
    if: github.ref == 'refs/heads/qa/v18-postdeploy-calendar-readonly-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      deployment: false
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: https://dev-panel.salon-bw.pl
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout source at immutable SHA
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify pinned UAT scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/qa/v18-postdeploy-calendar-readonly-20261111'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PLAYWRIGHT_BASE_URL" = 'https://dev-panel.salon-bw.pl'
          test -f scripts/ci/e2e-dev-only/preflight.cjs

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate test source without DEV access
        run: |
          pnpm --dir apps/panel exec tsc \
            --project uat/tsconfig.calendar.json --noEmit
          pnpm --dir apps/panel exec playwright test \
            --config=playwright.hosted-dev-calendar.config.ts --list

      - name: Prove MyDevil DEV DB and outbound off
        shell: bash
        env:
          SSH_KEY: '${{ secrets.MYDEVIL_SSH_KEY }}'
          SSH_FALLBACK: '${{ secrets.SSH_PRIVATE_KEY }}'
          SSH_KNOWN: '${{ secrets.MYDEVIL_KNOWN_HOSTS }}'
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p ~/.ssh
          key="$SSH_KEY"
          if [ -z "$key" ]; then key="$SSH_FALLBACK"; fi
          test -n "$key" && test -n "$SSH_KNOWN"
          if [[ "$key" == *"-----BEGIN "* ]]; then
            printf "%s" "$key" | tr -d '\r' > ~/.ssh/calendar-uat
          else
            printf "%s" "$key" | tr -d '\r' | base64 -d > ~/.ssh/calendar-uat
          fi
          chmod 600 ~/.ssh/calendar-uat
          printf '%s\n' "$SSH_KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/calendar-uat -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            vetternkraft@s0.mydevil.net \
            'cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev && node22 -' \
            < scripts/ci/e2e-dev-only/preflight.cjs

      - name: Install Chromium
        run: pnpm --dir apps/panel exec playwright install chromium --with-deps

      - name: Hosted DEV authenticated calendar UAT — read-only
        shell: bash
        env:
          DEV_ACCESS_USER: '${{ secrets.DEV_ACCESS_USER }}'
          DEV_ACCESS_PASSWORD: '${{ secrets.DEV_ACCESS_PASSWORD }}'
          E2E_ADMIN_EMAIL: stylist@salonbw.example.test
          E2E_ADMIN_PASSWORD: '${{ secrets.E2E_ADMIN_PASSWORD }}'
          CALENDAR_DEV_READ_ONLY_ACK: APPROVED_READ_ONLY
        run: |
          set -euo pipefail
          set +x
          test "$DEV_ACCESS_USER" = 'uat'
          test -n "$DEV_ACCESS_PASSWORD" && test -n "$E2E_ADMIN_PASSWORD"
          pnpm --dir apps/panel exec playwright test \
            --config=playwright.hosted-dev-calendar.config.ts \
            --project=hosted-dev-calendar-readonly \
            --workers=1 --retries=0 --reporter=list

      # Never upload authenticated browser traces, screenshots or session logs.
