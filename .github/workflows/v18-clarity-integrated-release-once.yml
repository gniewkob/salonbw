name: One-time V18 Clarity Integrated DEV Release

on:
  push:
    branches:
      - design/v18-communication-clarity-integrated-20261107
    paths:
      - .github/workflows/v18-clarity-integrated-release-once.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: v18-communication-clarity-integrated-dev-release
  cancel-in-progress: false

jobs:
  ci-and-panel:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/design/v18-communication-clarity-integrated-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: gniewkob/salonbw
      BRANCH: design/v18-communication-clarity-integrated-20261107
      RELEASE_SHA: ${{ github.sha }}
      PREVIOUS_PANEL_SHA: 0bc116db0c7254df396b3c20823aa235df1e2344
      CHECKED_CODE_SHA: fea74dcd99f636f101e6e015e9dfd281364fc7cc
    steps:
      - name: Verify exact source SHA
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$RELEASE_SHA"
          echo "RELEASE_SOURCE=$RELEASE_SHA"

      - name: Require V18 Fast Checks for exact integrated code
        run: |
          set -euo pipefail
          test "$(gh run view 42421416090 --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$CHECKED_CODE_SHA:success"
          echo "V18_FAST_CHECKS=PASS"

      - name: Full CI pinned to exact source
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          CI_ID=""
          for attempt in $(seq 1 45); do
            CI_ID="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$CI_ID" ]; then break; fi
            sleep 3
          done
          test -n "$CI_ID" || { echo "BLOCKED: exact-SHA CI run unavailable"; exit 1; }
          echo "FULL_CI_URL=https://github.com/$REPO/actions/runs/$CI_ID"
          gh run watch "$CI_ID" --repo "$REPO" --exit-status
          test "$(gh run view "$CI_ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$RELEASE_SHA:success"
          echo "FULL_CI=PASS"

      - name: Prevent overwriting another agent's DEV release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$RELEASE_SHA"
          node <<'NODE'
          (async()=>{
            const r=await fetch('https://dev-panel.salon-bw.pl/__release.json', {
              cache:'no-store', signal:AbortSignal.timeout(15000)
            });
            if(r.status!==200) throw Error('Cannot verify current DEV version: HTTP '+r.status);
            const v=await r.json();
            console.log('CURRENT_DEV_PANEL='+v.sha);
            if(v.sha!==process.env.PREVIOUS_PANEL_SHA) throw Error('DEV panel changed since the UI task started; rebase and review before deploying');
          })().catch(e=>{console.error(String(e.message||e));process.exitCode=1});
          NODE

      - name: Selective deployment — panel staging only
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$REPO" --ref "$BRANCH" -f ref="$RELEASE_SHA" -f target=panel -f environment=staging
          DEPLOY_ID=""
          for attempt in $(seq 1 45); do
            DEPLOY_ID="$(gh run list --repo "$REPO" --workflow deploy.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$DEPLOY_ID" ]; then break; fi
            sleep 3
          done
          test -n "$DEPLOY_ID" || { echo "BLOCKED: exact-SHA deploy unavailable"; exit 1; }
          echo "PANEL_DEPLOY_URL=https://github.com/$REPO/actions/runs/$DEPLOY_ID"
          gh run watch "$DEPLOY_ID" --repo "$REPO" --exit-status
          test "$(gh run view "$DEPLOY_ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$RELEASE_SHA:success"
          echo "PANEL_DEPLOY=PASS API_DEPLOY=SKIPPED LANDING_DEPLOY=SKIPPED"

      - name: Verify hosted release metadata and access control
        run: |
          node <<'NODE'
          (async()=>{
            const origin='https://dev-panel.salon-bw.pl';
            const request=path=>fetch(origin+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});
            const r=await request('/__release.json');
            if(r.status!==200)throw Error('Release metadata HTTP '+r.status);
            const v=await r.json();
            if(v.sha!==process.env.RELEASE_SHA||v.environment!=='development')throw Error('Wrong live release or environment');
            console.log('LIVE_SHA='+v.sha);
            for(const path of ['/studio-v18/customers/20','/studio-v18/calendar']){
              const r=await request(path);
              const dest=r.headers.get('location');
              const p=dest?new URL(dest,origin).pathname:null;
              console.log('ROUTE='+path+' HTTP='+r.status+' REDIRECT='+p);
              if(![302,303,307,308].includes(r.status)||p!=='/auth/login')
                throw Error('Invalid protected route '+path);
            }
            console.log('DEV_RELEASE_AND_ROUTE_GUARDS=PASS');
          })().catch(e=>{console.error('SMOKE FAILED: '+String(e.message||e));process.exitCode=1});
          NODE

# Remove this temporary workflow after an exact-SHA successful deployment.
