name: V18 mobile DnD — one-time scoped formatting
on:
  push:
    branches:
      - feat/v18-mobile-appointment-drag-20261111
    paths:
      - .github/workflows/v18-mobile-format-once.yml
permissions:
  contents: write
  actions: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false
      - name: Verify exact isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = gniewkob/salonbw
          test "$GITHUB_REF" = refs/heads/feat/v18-mobile-appointment-drag-20261111
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git ls-remote origin refs/heads/feat/v18-mobile-appointment-drag-20261111 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only the scoped V18 files
        run: |
          set -euo pipefail
          pnpm --dir apps/panel exec prettier --write \
            src/pages/studio-v18/calendar.tsx \
            src/components/calendar/CalendarView.tsx \
            src/components/calendar/EventCard.tsx \
            src/components/v18/V18MobileWeekAgenda.tsx \
            src/utils/v18MobileReschedule.ts \
            src/styles/V18MobileWeekAgenda.module.css \
            src/__tests__/v18CalendarPilot.test.tsx \
            src/__tests__/v18MobileWeekAgenda.test.tsx \
            src/__tests__/v18MobileReschedule.test.ts
      - name: Guard change scope and push formatter commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          allowed="$(printf '%s\n' \
            apps/panel/src/pages/studio-v18/calendar.tsx \
            apps/panel/src/components/calendar/CalendarView.tsx \
            apps/panel/src/components/calendar/EventCard.tsx \
            apps/panel/src/components/v18/V18MobileWeekAgenda.tsx \
            apps/panel/src/utils/v18MobileReschedule.ts \
            apps/panel/src/styles/V18MobileWeekAgenda.module.css \
            apps/panel/src/__tests__/v18CalendarPilot.test.tsx \
            apps/panel/src/__tests__/v18MobileWeekAgenda.test.tsx \
            apps/panel/src/__tests__/v18MobileReschedule.test.ts | LC_ALL=C sort)"
          changed="$(git diff --name-only | LC_ALL=C sort)"
          if [[ -n "$changed" ]]; then
            if [[ -n "$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))" ]]; then
              echo "::error::Formatter changed an unexpected file"
              exit 1
            fi
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $changed
            git commit -m 'style(v18): format mobile drag implementation'
            git push origin "HEAD:refs/heads/feat/v18-mobile-appointment-drag-20261111"
          fi
          gh workflow run v18-mobile-dnd-qa.yml --repo "$GITHUB_REPOSITORY" --ref feat/v18-mobile-appointment-drag-20261111
