name: P0 DEV browser client-login proof
on:
  push:
    branches:
      - codex/p0-dev-client-ui-proof-20261029
    paths:
      - '.github/workflows/p0-dev-client-ui-proof.yml'
      - 'apps/panel/uat/hosted-dev-client-login.pw.ts'
      - 'apps/panel/playwright.p0-login.config.ts'
      - 'scripts/ci/p0-client-ui/**'
permissions:
  contents: read
concurrency:
  group: salonbw-p0-dev-client-ui-proof
  cancel-in-progress: false
jobs:
  dev-client-browser-login:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/codex/p0-dev-client-ui-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      deployment: false
    env:
      DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
      DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate source and staging secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEV_ACCESS_USER" == "uat" && -n "$DEV_ACCESS_PASSWORD" ]]
          test -f apps/panel/uat/hosted-dev-client-login.pw.ts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure SSH with pinned host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_FALLBACK: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          key="$SSH_KEY"
          if [[ -z "$key" ]]; then key="$SSH_FALLBACK"; fi
          [[ -n "$key" && -n "$SSH_KNOWN" ]] || { echo "::error::Missing pinned staging SSH identity"; exit 2; }
          if [[ "$key" == *"-----BEGIN "* ]]; then
            printf '%s' "$key" | tr -d '\r' > ~/.ssh/key
          else
            printf '%s' "$key" | tr -d '\r' | base64 -d > ~/.ssh/key
          fi
          chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prove DEV database and outbound isolation before registration
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vetternkraft@s0.mydevil.net \
            'cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev && node22 -' \
            < scripts/ci/p0-client-ui/preflight.cjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/panel exec playwright install chromium --with-deps
      - name: Real browser client login, booking wizard and visits on DEV
        shell: bash
        run: |
          set -euo pipefail
          set +x
          pnpm --dir apps/panel exec playwright test \
            --config=playwright.p0-login.config.ts \
            --workers=1 --reporter=list
