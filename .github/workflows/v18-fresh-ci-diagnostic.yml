# Temporary branch-only runner diagnostic for the Nov 13 GitHub Actions
# startup incident. This does not override CI, secret-scan, or release gates.
name: V18 Fresh CI Diagnostic

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v18-fresh-ci-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-canary:
    name: Fresh runner startup check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove that a GitHub-hosted runner executed
        run: |
          echo "FRESH_RUNNER_EXECUTED=1"
          uname -a
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@v5
      - name: Show SHA
        run: git rev-parse HEAD

  api-regression:
    name: Fresh API P1 unit regression
    needs: runner-canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter salonbw-backend exec jest --runInBand src/appointments/appointments.service.spec.ts src/appointments/appointments.controller.spec.ts
      - run: pnpm --filter salonbw-backend typecheck

  panel-regression:
    name: Fresh client panel P1 regression
    needs: runner-canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salonbw/panel exec jest --runInBand src/__tests__/ClientDashboard.test.tsx src/__tests__/visitsPage.test.tsx
      - run: pnpm --filter @salonbw/panel typecheck
