name: One-time V18 Communication UAT Release

on:
  push:
    branches:
      - design/v18-communication-uat-hardening-20261107
    paths:
      - .github/workflows/v18-communication-uat-release-once.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: v18-communication-uat-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/design/v18-communication-uat-hardening-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: gniewkob/salonbw
      BRANCH: design/v18-communication-uat-hardening-20261107
      RELEASE_SHA: ${{ github.sha }}
      CI: 'true'
      NEXT_PUBLIC_API_URL: /api
    steps:
      - name: Verify feature SHA and checkout
        uses: actions/checkout@v5
        with:
          ref: design/v18-communication-uat-hardening-20261107
      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$RELEASE_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend lint
        run: pnpm --filter @salonbw/panel lint
      - name: Check frontend type safety
        run: pnpm --filter @salonbw/panel typecheck
      - name: Regression — communication editor and consent lifecycle
        run: |
          pnpm --filter @salonbw/panel exec jest --runInBand \
            src/__tests__/communicationConsents.test.tsx \
            src/__tests__/v18CommunicationUnsavedGuard.test.tsx \
            src/__tests__/customersCrashGuards.test.tsx
      - name: Full CI exact SHA
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          ID=""
          for i in $(seq 1 35); do
            ID="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$ID" ]; then break; fi
            sleep 3
          done
          test -n "$ID" || { echo 'BLOCKED: CI run not found'; exit 1; }
          echo "FULL_CI_URL=https://github.com/$REPO/actions/runs/$ID"
          gh run watch "$ID" --repo "$REPO" --exit-status
          test "$(gh run view "$ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$RELEASE_SHA:success"
          echo "FULL_CI=PASS"
      - name: Deploy only Panel to DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$RELEASE_SHA"
          gh workflow run deploy.yml --repo "$REPO" --ref "$BRANCH" -f ref="$RELEASE_SHA" -f target=panel -f environment=staging
          ID=""
          for i in $(seq 1 35); do
            ID="$(gh run list --repo "$REPO" --workflow deploy.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$ID" ]; then break; fi
            sleep 3
          done
          test -n "$ID" || { echo 'BLOCKED: Panel deploy not found'; exit 1; }
          echo "PANEL_DEV_DEPLOY_URL=https://github.com/$REPO/actions/runs/$ID"
          gh run watch "$ID" --repo "$REPO" --exit-status
          test "$(gh run view "$ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$RELEASE_SHA:success"
          echo "PANEL_DEV_DEPLOY=PASS"
          echo "API_DEPLOY=SKIPPED LANDING_DEPLOY=SKIPPED PRODUCTION=UNCHANGED"
      - name: Verify exact live release and authenticated route guards
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const origin='https://dev-panel.salon-bw.pl';
            const request=(path)=>fetch(origin+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});
            const meta=await request('/__release.json');
            if(meta.status!==200)throw Error('Release metadata HTTP '+meta.status);
            const data=await meta.json();
            console.log('LIVE_SHA='+data.sha);
            if(data.sha!==process.env.RELEASE_SHA || data.environment!=='development')throw Error('Unexpected release');
            for(const path of ['/studio-v18/customers/20','/studio-v18/calendar']){
              const r=await request(path);
              const location=r.headers.get('location');
              const p=location?new URL(location,origin).pathname:null;
              console.log('ROUTE='+path+' HTTP='+r.status+' REDIRECT='+p);
              if(![302,303,307,308].includes(r.status)||p!=='/auth/login')
                throw Error('Unexpected route guard '+path);
            }
            console.log('DEV_RELEASE_AND_ROUTE_GUARDS=PASS');
          })().catch(e=>{console.error('LIVE_SMOKE_FAIL: '+String(e.message||e));process.exitCode=1});
          NODE
