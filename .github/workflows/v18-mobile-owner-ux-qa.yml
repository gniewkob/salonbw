name: V18 Calendar — mobile owner UX CI

on:
  push:
    branches:
      - feat/v18-mobile-calendar-owner-20261109
    paths:
      - 'apps/panel/src/components/v18/V18MobileWeekAgenda.tsx'
      - 'apps/panel/src/styles/V18MobileWeekAgenda.module.css'
      - 'apps/panel/src/styles/V18Calendar.module.css'
      - 'apps/panel/src/components/calendar/CalendarView.tsx'
      - 'apps/panel/src/pages/studio-v18/calendar.tsx'
      - 'apps/panel/src/__tests__/v18MobileWeekAgenda.test.tsx'
      - 'apps/panel/src/__tests__/v18CalendarPilot.test.tsx'
      - 'apps/panel/tests/visual/studio-v18-calendar-integrity.spec.ts'
      - '.github/workflows/v18-mobile-owner-ux-qa.yml'

permissions:
  contents: read

concurrency:
  group: salonbw-v18-mobile-owner-ux
  cancel-in-progress: true

jobs:
  mobile-owner-qa:
    name: V18 owner calendar — Jest and browser 1366/390
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_VERSION: '22'
      PNPM_VERSION: '10.14.0'
      APP_ENV: development
      NEXT_PUBLIC_DEPLOYMENT_ENV: development
      NEXT_PUBLIC_AUTH_COOKIE_PREFIX: dev_
      NEXT_PUBLIC_API_URL: /api
      DEV_ACCESS_USER: studio-fixture
      DEV_ACCESS_PASSWORD: studio-fixture-password
      PLAYWRIGHT_BASE_URL: ''

    steps:
      - name: Checkout exact branch commit without credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint changed TS/TSX
        run: |
          pnpm --dir apps/panel exec eslint \
            src/components/v18/V18MobileWeekAgenda.tsx \
            src/components/calendar/CalendarView.tsx \
            src/pages/studio-v18/calendar.tsx \
            src/__tests__/v18MobileWeekAgenda.test.tsx \
            src/__tests__/v18CalendarPilot.test.tsx

      - name: Prettier CSS check
        run: |
          pnpm --dir apps/panel exec prettier --check \
            src/styles/V18MobileWeekAgenda.module.css \
            src/styles/V18Calendar.module.css

      - name: Typecheck full panel
        run: pnpm --dir apps/panel exec tsc --noEmit

      - name: React and calendar regression tests
        run: |
          pnpm --dir apps/panel exec jest --runInBand \
            src/__tests__/v18MobileWeekAgenda.test.tsx \
            src/__tests__/v18CalendarPilot.test.tsx \
            src/__tests__/useCalendar.test.tsx

      - name: Install Chromium
        run: pnpm --dir apps/panel exec playwright install chromium --with-deps

      - name: 'Synthetic Playwright: desktop and mobile (no real data)'
        run: |
          pnpm --dir apps/panel exec playwright test \
            tests/visual/studio-v18-calendar-integrity.spec.ts \
            --project=desktop-1366 --project=mobile-chromium-390 \
            --workers=2 --retries=0 --reporter=list

      # Only synthetic fixture data used; no deploy, no real provider sends.
