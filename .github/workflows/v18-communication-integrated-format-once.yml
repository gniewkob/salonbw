name: One-time V18 Integrated Clarity Prettier

on:
  push:
    branches:
      - design/v18-communication-clarity-integrated-20261107
    paths:
      - .github/workflows/v18-communication-integrated-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/design/v18-communication-clarity-integrated-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v5
        with:
          ref: design/v18-communication-clarity-integrated-20261107
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed frontend files only
        run: |
          pnpm --filter @salonbw/panel exec prettier --write \
            src/components/communication/CustomerCommunicationPreferences.tsx \
            src/styles/V18CommunicationPreferences.module.css \
            src/__tests__/communicationConsents.test.tsx
      - name: Commit formatting to isolated branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'design/v18-communication-clarity-integrated-20261107'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/panel/src/components/communication/CustomerCommunicationPreferences.tsx \
            apps/panel/src/styles/V18CommunicationPreferences.module.css \
            apps/panel/src/__tests__/communicationConsents.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(v18): apply repository formatting to communication clarity'
            git push origin HEAD:refs/heads/design/v18-communication-clarity-integrated-20261107
          fi
