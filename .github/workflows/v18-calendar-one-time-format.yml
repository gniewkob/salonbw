name: One-time V18 Calendar formatting

on:
  push:
    branches:
      - design/v18-calendar-pilot-20261107
    paths:
      - .github/workflows/v18-calendar-one-time-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/design/v18-calendar-pilot-20261107'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v5
        with:
          ref: design/v18-calendar-pilot-20261107
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact new V18 calendar files
        run: |
          pnpm --filter @salonbw/panel exec prettier --write \
            src/pages/studio-v18/calendar.tsx \
            src/__tests__/v18CalendarPilot.test.tsx \
            src/components/calendar/CalendarView.tsx \
            src/styles/V18Calendar.module.css
      - name: Commit formatted files to isolated feature branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'design/v18-calendar-pilot-20261107'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/panel/src/pages/studio-v18/calendar.tsx \
            apps/panel/src/__tests__/v18CalendarPilot.test.tsx \
            apps/panel/src/components/calendar/CalendarView.tsx \
            apps/panel/src/styles/V18Calendar.module.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(v18): apply repository Prettier formatting'
            git push origin HEAD:refs/heads/design/v18-calendar-pilot-20261107
          fi
