name: V18 — exact-CI guarded API then panel DEV-only promotion

on:
  push:
    branches:
      - qa/v18-dev-staff-readonly-inventory-20261111
    paths:
      - '.github/workflows/v18-dev-serial-release-promotion.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: salonbw-v18-exact-dev-api-panel-promotion
  cancel-in-progress: false

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, 'approved-v18-dev-release-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: staging
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: gniewkob/salonbw
      RELEASE_BRANCH: feat/v18-bookable-team-visibility-20261111
      RELEASE_SHA: 33a75b718a1f58fd0b5d1ad83f5625283b08f5b9
      DEPLOY_WORKFLOW_REF: feat/v18-bookable-team-visibility-20261111
      EXPECTED_OLD_API_SHA: abc68723460dd1fa5ad21ce2554bd2a4f492c16f
      CI_RUN_ID: '43088931684'

    steps:
      - name: Checkout release candidate at exact immutable SHA
        uses: actions/checkout@v5
        with:
          ref: 33a75b718a1f58fd0b5d1ad83f5625283b08f5b9
          fetch-depth: 0
          persist-credentials: false

      - name: Check application source and staging-only deployment boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$REPO/commits/$RELEASE_BRANCH" --jq .sha)" = "$RELEASE_SHA"
          git merge-base --is-ancestor e0d3ed72a578c89d07266933814425449f59ee2a "$RELEASE_SHA"
          appdiff="$(git diff --name-only e0d3ed72a578c89d07266933814425449f59ee2a "$RELEASE_SHA" -- \
             backend/salonbw-backend/src \
             apps/panel/src/pages apps/panel/src/components apps/panel/src/hooks \
             apps/panel/src/styles apps/panel/src/utils)"
          test -z "$appdiff" || {
            echo "::error::Application code changed since real-stack browser PASS"
            exit 1
          }
          if grep -Eq 'staging-release-snapshot\.sh|id: dev_recovery|Restore previous development runtime' .github/workflows/deploy.yml; then
            echo "::error::Automatic deployment snapshots are still present"
            exit 1
          fi
          echo "APP_SOURCE_MATCHES_FULLSTACK_QA=PASS"
          echo "DEV_PERSISTENT_SNAPSHOTS=DISABLED"
          echo "PRODUCTION_DEPLOYMENT=PROHIBITED"

      - name: Await exact-SHA full named CI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            record="$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID" --jq '[.head_sha,.status,(.conclusion // "")] | @tsv')"
            read -r head state conclusion <<< "$record"
            test "$head" = "$RELEASE_SHA" || {
              echo "::error::CI run SHA mismatch"; exit 1;
            }
            if [[ "$state" == completed ]]; then
              test "$conclusion" = success || {
                echo "::error::Full named CI failed: $CI_RUN_ID"; exit 1;
              }
              echo "FULL_NAMED_CI_RUN=$CI_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              echo "FULL_NAMED_CI=PASS" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 15
          done
          test "$state" = completed || { echo "::error::CI timed out"; exit 1; }
          test "$(gh api "repos/$REPO/commits/$RELEASE_BRANCH" --jq .sha)" = "$RELEASE_SHA"

      - name: Check currently deployed DEV API is exactly expected or already upgraded
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 4); do
            curl -fsS --max-time 25 -D /tmp/v18-api-preflight.headers \
              -o /dev/null https://dev-api.salon-bw.pl/healthz && break
            sleep 3
          done
          actual="$(awk 'tolower($1)=="x-salonbw-release:" {gsub(/\r/,"",$2);print $2}' /tmp/v18-api-preflight.headers | tail -n 1)"
          if [[ "$actual" != "$EXPECTED_OLD_API_SHA" && "$actual" != "$RELEASE_SHA" ]]; then
            echo "::error::Unexpected API deployment SHA; release blocked"
            exit 1
          fi
          echo "DEPLOYED_DEV_API_BEFORE=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy backend API only to MyDevil DEV
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy-environment.sh development api "$RELEASE_SHA" --execute

      - name: Check hosted API release SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsS --max-time 25 -D /tmp/v18-api-post.headers \
              -o /dev/null https://dev-api.salon-bw.pl/healthz || true
            actual="$(awk 'tolower($1)=="x-salonbw-release:" {gsub(/\r/,"",$2);print $2}' /tmp/v18-api-post.headers | tail -n 1)"
            if [[ "$actual" == "$RELEASE_SHA" ]]; then
              echo "DEV_API_NEW_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Hosted DEV API did not serve release SHA"
          exit 1

      - name: Checkout reviewed private-data-free acceptance script
        uses: actions/checkout@v5
        with:
          ref: f1610b65be6d495396bca0d1c617b1c7c7c7a9da
          path: private-qa-scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Configure pinned MyDevil SSH
        shell: bash
        env:
          MYDEVIL_SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MYDEVIL_KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          key="${MYDEVIL_SSH_KEY:-$SSH_PRIVATE_KEY}"
          test -n "$key"
          if printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            printf '%s' "$key" | tr -d '\r' > ~/.ssh/v18dev
          else
            printf '%s' "$key" | tr -d '\r' | base64 -d > ~/.ssh/v18dev
          fi
          chmod 600 ~/.ssh/v18dev
          test -n "$MYDEVIL_KNOWN_HOSTS"
          printf '%s\n' "$MYDEVIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify owner and technical admin via real hosted API and one-provider roster
        shell: bash
        run: |
          set -euo pipefail
          test -f private-qa-scripts/scripts/mydevil/verify-v18-hosted-roster.cjs
          node --check private-qa-scripts/scripts/mydevil/verify-v18-hosted-roster.cjs
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/v18dev vetternkraft@s0.mydevil.net \
            "cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev &&
             EXPECTED_V18_SHA=$RELEASE_SHA node22 -" \
             < private-qa-scripts/scripts/mydevil/verify-v18-hosted-roster.cjs
          echo "HOSTED_DEV_API_OWNER_ADMIN_ROSTER=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy V18 panel only to MyDevil DEV
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy-environment.sh development panel "$RELEASE_SHA" --execute

      - name: Verify live panel SHA, environment and stable API
        shell: bash
        env:
          DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEV_ACCESS_USER"
          test -n "$DEV_ACCESS_PASSWORD"
          metadata="$(curl -fsS --max-time 30 \
            --user "$DEV_ACCESS_USER:$DEV_ACCESS_PASSWORD" \
            https://dev-panel.salon-bw.pl/__release.json)"
          test "$(printf '%s' "$metadata" | jq -r .sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$metadata" | jq -r .environment)" = development
          curl -fsS --max-time 20 -D /tmp/v18-api-final.headers \
            -o /dev/null https://dev-api.salon-bw.pl/healthz
          api="$(awk 'tolower($1)=="x-salonbw-release:" {gsub(/\r/,"",$2);print $2}' /tmp/v18-api-final.headers | tail -n 1)"
          test "$api" = "$RELEASE_SHA"
          echo "DEV_PANEL_NEW_SHA=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "DEV_API_FINAL_SHA=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "MYDEVIL_OWN_SNAPSHOTS=NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION=UNTOUCHED" >> "$GITHUB_STEP_SUMMARY"
          echo "HOSTED_DESKTOP_MOBILE_OWNER_UI_UAT=REQUIRED" >> "$GITHUB_STEP_SUMMARY"
