name: One-shot Security Lockfile Refresh

on:
  push:
    branches:
      - security/runtime-advisories-qs-ip-jsyaml-20261029
    paths:
      - .github/workflows/one-shot-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/security/runtime-advisories-qs-ip-jsyaml-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Validate expected patched resolutions
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          git diff --check
          node <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const required = { qs: '6.16.1', 'ip-address': '10.7.4', 'js-yaml': '5.4.1' };
          const num = s => s.split('.').map(Number);
          const gte = (a,b) => { const x=num(a),y=num(b);
            for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i];}return true; };
          for (const [name,min] of Object.entries(required)) {
            const versions = [...lock.matchAll(new RegExp('^  '+name+'@(\\d+\\.\\d+\\.\\d+):','gm'))].map(x=>x[1]);
            const selected = name==='js-yaml' ? versions.filter(v=>v.startsWith('5.')) : versions;
            if(!selected.length || selected.some(v=>!gte(v,min)) || (name==='qs' && selected.some(v=>!v.startsWith('6.'))))
              throw new Error('Unpatched resolution for '+name+': '+selected.join(','));
            process.stdout.write(name+'='+selected.join(',')+'\n');
          }
          NODE
          git diff --exit-code -- pnpm-workspace.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'BLOCKED: expected canonical lockfile refresh'
            exit 2
          fi
      - name: Commit only lockfile on security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'security(deps): regenerate patched lockfile using pnpm 10.14.0'
          git push origin HEAD:refs/heads/security/runtime-advisories-qs-ip-jsyaml-20261029
