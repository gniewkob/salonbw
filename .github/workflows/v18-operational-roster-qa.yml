name: V18 — operational staff API boundary checks

on:
  push:
    branches:
      - feat/v18-calendar-operational-roster-api-20261111
    paths:
      - '.github/workflows/v18-operational-roster-qa.yml'
      - 'backend/salonbw-backend/src/calendar/**'
      - 'backend/salonbw-backend/test/calendar-operational-roster.pg-spec.ts'

permissions:
  contents: read

jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salonbw_roster_uat
          POSTGRES_PASSWORD: salonbw_roster_uat_only
          POSTGRES_DB: salonbw_roster_uat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salonbw_roster_uat -d salonbw_roster_uat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      APP_ENV: test
      OUTBOUND_DELIVERY_ENABLED: 'false'
      SMSAPI_ENABLED: 'false'
      WHATSAPP_ENABLED: 'false'
      EMAIL_ENABLED: 'false'
      TEST_DATABASE_URL: postgresql://salonbw_roster_uat:salonbw_roster_uat_only@127.0.0.1:5432/salonbw_roster_uat
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --dir backend/salonbw-backend exec tsc --project tsconfig.build.json --noEmit
      - name: Prettier + ESLint scoped files
        run: |
          pnpm --dir backend/salonbw-backend exec prettier --check \
            src/calendar/calendar.service.ts \
            src/calendar/calendar.controller.ts \
            src/calendar/dto/calendar-query.dto.ts \
            src/calendar/calendar.controller.spec.ts \
            src/calendar/calendar.operational-roster.spec.ts
          pnpm --dir backend/salonbw-backend exec eslint \
            src/calendar/calendar.service.ts \
            src/calendar/calendar.controller.ts \
            src/calendar/dto/calendar-query.dto.ts
      - name: Calendar staff and RBAC unit regression
        run: |
          pnpm --dir backend/salonbw-backend exec jest --runInBand --runTestsByPath \
            src/calendar/calendar.controller.spec.ts \
            src/calendar/calendar.owner-staff.spec.ts \
            src/calendar/calendar.operational-roster.spec.ts \
            src/calendar/calendar.service.spec.ts

      - name: Isolated operational roster PostgreSQL integration
        run: |
          pnpm --dir backend/salonbw-backend exec jest \
            --config test/jest-e2e.json \
            --runInBand \
            --testRegex 'calendar-operational-roster[.]pg-spec[.]ts$'
