name: One-shot Sharp Pin Lockfile Sync
on:
  push:
    branches:
      - security/replace-jimp-gallery-thumbnail-20261030
    paths:
      - .github/workflows/one-shot-sharp-pin-lockfile.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/security/replace-jimp-gallery-thumbnail-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify lockfile matches pinned sharp
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('backend/salonbw-backend/package.json','utf8'));
          const lock=fs.readFileSync('pnpm-lock.yaml','utf8');
          if(pkg.dependencies.sharp!=='0.35.5') throw new Error('Backend Sharp pin differs from tested version');
          if(!lock.includes('sharp@0.35.5:')) throw new Error('Resolved Sharp 0.35.5 missing');
          if(/(^|\n)  (?:'jimp@|'zod@)/m.test(lock))
            throw new Error('Forbidden Jimp/Zod 3 resolution');
          console.log('PINNED_SHARP_LOCK=PASS');
          NODE
          pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
          git diff --check
          git diff --exit-code -- backend/salonbw-backend/package.json
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'BLOCKED: pnpm lock should change'
            exit 2
          fi
      - name: Commit canonical lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'security(deps): lock sharp exact version for MyDevil'
          git push origin HEAD:refs/heads/security/replace-jimp-gallery-thumbnail-20261030
