name: Claude Code Review

# On-demand only. Previously ran on every PR push (opened/synchronize/...),
# ~30-40 runs/day against the Claude subscription. Not a required check.
# Trigger it by:
#   - adding the `claude-review` label to a PR, or
#   - Actions -> "Claude Code Review" -> Run workflow (enter the PR number), or
#   - mentioning @claude in a PR comment (handled by claude.yml).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude-review'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Permit only Dependabot-authored PRs; never trust arbitrary bots.
          allowed_bots: 'dependabot[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

