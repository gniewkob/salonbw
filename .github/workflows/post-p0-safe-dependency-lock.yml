name: Post-P0 dependency lock refresh (one-shot)
on:
  push:
    branches:
      - codex/post-p0-safe-dependency-batch-20261029
    paths:
      - 'package.json'
      - 'apps/panel/package.json'
      - 'apps/landing/package.json'
      - 'backend/salonbw-backend/package.json'
permissions:
  contents: write
concurrency:
  group: post-p0-safe-deps-lock
  cancel-in-progress: false
jobs:
  update-lock:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/codex/post-p0-safe-dependency-batch-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false
      - name: Regenerate lockfile using canonical pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          test -s pnpm-lock.yaml
          git diff --name-only --exit-code -- . ':!pnpm-lock.yaml' || {
            echo "::error::Unexpected files modified by package manager"
            exit 1
          }
          git diff --stat -- pnpm-lock.yaml
          echo "LOCKFILE_REGENERATED=PASS"
      - name: Commit generated lock and remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'salonbw-dependency-bot'
          git config user.email 'salonbw-dependency-bot@users.noreply.github.com'
          git add pnpm-lock.yaml
          git rm -- .github/workflows/post-p0-safe-dependency-lock.yml
          git diff --cached --quiet && exit 2
          git commit -m "build(deps): regenerate frozen lock for bounded post-P0 patch batch"
          git push origin HEAD:codex/post-p0-safe-dependency-batch-20261029
          echo "SAFE_DEPENDENCY_BATCH_LOCK=PASS"
