name: V18 single-owner form — guarded panel DEV promotion

on:
  push:
    branches:
      - feat/v18-single-operator-appointment-form-20261110
    paths:
      - '.github/workflows/v18-single-owner-staging-20261110.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: salonbw-single-owner-panel-dev-promotion
  cancel-in-progress: false

jobs:
  deploy-panel:
    name: Exact SHA standard CI before panel-only DEV deployment
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BRANCH: feat/v18-single-operator-appointment-form-20261110
      BASELINE_SHA: 727f0e861213842c6c1594d3843d923224141ba8
      REVIEWED_UI_SHA: ff37c3b6ec9e13a299527a274529001a1101cd0a
      TRUSTED_DEPLOY_BLOB: 7353107936b90dec61772628adad31c02fc7a125
      TRUSTED_SNAPSHOT_BLOB: c20f20856d97692127a16e4d47bcacb7be2cdfdc

    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22 for staging release policy
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify immutable scope, trusted deploy code and prior P0 UI PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = gniewkob/salonbw
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$REVIEWED_UI_SHA" "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/deploy.yml)" = "$TRUSTED_DEPLOY_BLOB"
          test "$(git rev-parse HEAD:scripts/mydevil/staging-release-snapshot.sh)" = "$TRUSTED_SNAPSHOT_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/deploy.yml?ref=master" --jq '.sha')" = "$TRUSTED_DEPLOY_BLOB"

          changed="$(git diff --name-only "$BASELINE_SHA" "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/v18-single-owner-booking-qa.yml \
            .github/workflows/v18-single-owner-staging-20261110.yml \
            apps/panel/src/components/calendar/AppointmentDrawer.tsx \
            apps/panel/src/__tests__/appointmentDrawer.test.tsx \
            apps/panel/tests/visual/studio-v18-owner-mobile-journey.spec.ts | LC_ALL=C sort)"
          test "$changed" = "$expected"

          passed="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow v18-single-owner-booking-qa.yml \
            --commit "$REVIEWED_UI_SHA" --limit 10 \
            --json headSha,status,conclusion |
            jq -r --arg sha "$REVIEWED_UI_SHA" \
              '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length')"
          test "$passed" -ge 1
          GITHUB_OUTPUT= DEPLOY_ENV=staging DEPLOY_TARGET=panel node scripts/ci/deployment-config.mjs
          echo "PANEL_DEV_SCOPED_PREFLIGHT=PASS"

      - name: Dispatch full standard CI on exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      - name: Require full exact-SHA standard CI success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CI --event workflow_dispatch \
              --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,headSha,status,conclusion |
              jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty')"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r '.databaseId' <<<"$run")"
              status="$(jq -r '.status' <<<"$run")"
              outcome="$(jq -r '.conclusion // ""' <<<"$run")"
              if [[ "$status" = completed ]]; then
                echo "FULL_STANDARD_CI_RUN=$run_id"
                test "$outcome" = success
                echo "EXACT_SHA_STANDARD_CI=PASS"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "STANDARD_CI_BLOCKED: no success for exact SHA" >&2
          exit 1

      - name: Reverify branch before touching DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/deploy.yml)" = "$TRUSTED_DEPLOY_BLOB"
          echo "PANEL_DEV_RELEASE_LOCK=PASS"

      - name: Deploy panel only to DEV with snapshot and rollback
        shell: bash
        env:
          DEPLOY_WORKFLOW_REF: feat/v18-single-operator-appointment-form-20261110
        run: |
          set -euo pipefail
          scripts/deploy-environment.sh development panel "$GITHUB_SHA" --execute

      - name: Evidence receipt
        shell: bash
        run: |
          echo "PANEL_DEV_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "BACKEND_API=UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION=UNTOUCHED" >> "$GITHUB_STEP_SUMMARY"
          echo "OWNER_UAT=REQUIRES_VISUAL_SIGNOFF" >> "$GITHUB_STEP_SUMMARY"
