name: V18 single-owner — one-time scoped Playwright formatting

on:
  push:
    branches:
      - feat/v18-single-operator-appointment-form-20261110
    paths:
      - '.github/workflows/v18-owner-one-time-prettier.yml'

permissions:
  contents: write

jobs:
  format:
    name: Format only synthetic browser acceptance file
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install immutable deps
        run: pnpm install --frozen-lockfile

      - name: Format only Playwright fixture
        run: |
          pnpm --dir apps/panel exec prettier --write \
            tests/visual/studio-v18-owner-mobile-journey.spec.ts

      - name: Commit scoped code style only, fail on any branch drift
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gniewkob/salonbw'
          test "$GITHUB_REF" = 'refs/heads/feat/v18-single-operator-appointment-form-20261110'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/v18-single-operator-appointment-form-20261110 | cut -f 1)" = "$GITHUB_SHA"

          if git diff --quiet; then
            echo 'PRETTIER_ALREADY_CLEAN=PASS'
            exit 0
          fi
          git config user.name 'salonbw-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/panel/tests/visual/studio-v18-owner-mobile-journey.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(v18): normalize synthetic mobile acceptance test'
          git push origin HEAD:refs/heads/feat/v18-single-operator-appointment-form-20261110
