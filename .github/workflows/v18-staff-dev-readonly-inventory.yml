name: V18 — DEV staff read-only census (no PII)

on:
  push:
    branches:
      - qa/v18-dev-staff-readonly-inventory-20261111
    paths:
      - '.github/workflows/v18-staff-dev-readonly-inventory.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    steps:
      - name: Configure SSH key for DEV read-only diagnostic
        env:
          MYDEVIL_SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MYDEVIL_KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = gniewkob/salonbw
          test "$GITHUB_REF" = refs/heads/qa/v18-dev-staff-readonly-inventory-20261111
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key="${MYDEVIL_SSH_KEY:-$SSH_PRIVATE_KEY}"
          test -n "$key"
          if printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            printf '%s' "$key" | tr -d '\r' > ~/.ssh/salonbw-dev
          else
            printf '%s' "$key" | tr -d '\r' | base64 -d > ~/.ssh/salonbw-dev
          fi
          chmod 600 ~/.ssh/salonbw-dev
          test -n "$MYDEVIL_KNOWN_HOSTS"
          printf '%s\n' "$MYDEVIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read active DEV API staff census only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/salonbw-dev vetternkraft@s0.mydevil.net \
            'cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev && node22 -' <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dotenv = require('dotenv');
          if(!fs.existsSync('.env')) throw Error('DEV API environment missing');
          dotenv.config({path:path.resolve('.env'),quiet:true});
          if (process.env.APP_ENV !== 'development') {
            throw Error('Cannot prove DEV-only environment; aborting read');
          }
          const {Client}=require('pg');
          const config = process.env.DATABASE_URL
            ? {connectionString:process.env.DATABASE_URL}
            : {
                host:process.env.DB_HOST || process.env.PGHOST,
                port:Number(process.env.DB_PORT || process.env.PGPORT || 5432),
                user:process.env.DB_USER || process.env.PGUSER,
                password:process.env.DB_PASS || process.env.PGPASSWORD,
                database:process.env.DB_NAME || process.env.PGDATABASE,
              };
          if(!config.connectionString && (!config.host || !config.user || !config.database)){
            throw Error('Missing DEV DB connection fields');
          }
          const client=new Client(config);
          (async()=>{
            await client.connect();
            try{
              await client.query('BEGIN TRANSACTION READ ONLY');
              const result=await client.query(`SELECT id, name, role::text AS role, "isSystemAdmin" AS technical
              FROM "users" WHERE role::text IN ('admin','employee','receptionist') ORDER BY id`);
              const actualDb=await client.query('SELECT current_database() AS name');
              const projected=result.rows.map(({id,name,role,technical})=>({
                id,role,technical,
                ownerNameCandidate:/aleksandr|(^|\\s)ola(\\s|$)/i.test(name),
                syntheticNameCandidate:/test|synthetic|migracyjn|uat|e2e/i.test(name),
              }));
              const providers=projected.filter(x=>!x.technical && ['admin','employee'].includes(x.role));
              console.log(JSON.stringify({
                status:'DEV_STAFF_READONLY',
                databaseName:actualDb.rows[0]?.name ?? 'UNKNOWN',
                totalStaffUsers:projected.length,
                bookableByExistingPolicy:providers.length,
                apparentOwnerCount:providers.filter(x=>x.ownerNameCandidate).length,
                apparentSyntheticCount:providers.filter(x=>x.syntheticNameCandidate).length,
                roles:projected,
                dataWrite:false,
                notes:'Heuristic names are diagnostic only, never authority for production filtering',
              }));
              await client.query('ROLLBACK');
            } finally {await client.end();}
          })().catch(e=>{console.error('READONLY_CENSUS_BLOCKED: '+e.message);process.exitCode=1});
          NODE
