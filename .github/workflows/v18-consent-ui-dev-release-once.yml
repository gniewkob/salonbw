name: One-time V18 Consent UI DEV Release

on:
  push:
    branches:
      - design/v18-consents-edit-workflow-20261107
    paths:
      - .github/workflows/v18-consent-ui-dev-release-once.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: v18-consent-ui-dev-release
  cancel-in-progress: false

jobs:
  full-ci-panel-only:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/design/v18-consents-edit-workflow-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: gniewkob/salonbw
      BRANCH: design/v18-consents-edit-workflow-20261107
      SHA: ${{ github.sha }}
    steps:
      - name: Verify immutable feature SHA
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$SHA"
          echo "SOURCE_SHA=$SHA"

      - name: Run full CI for exact SHA
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          CI_ID=""
          for attempt in $(seq 1 45); do
            CI_ID="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)"
            if [ -n "$CI_ID" ]; then break; fi
            sleep 3
          done
          test -n "$CI_ID" || { echo 'Cannot locate exact-SHA full CI'; exit 1; }
          echo "CI_URL=https://github.com/$REPO/actions/runs/$CI_ID"
          gh run watch "$CI_ID" --repo "$REPO" --exit-status
          test "$(gh run view "$CI_ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$SHA:success"
          echo "FULL_CI=PASS"

      - name: Deploy Panel only to staging
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$SHA"
          gh workflow run deploy.yml --repo "$REPO" --ref "$BRANCH" -f ref="$SHA" -f target=panel -f environment=staging
          DEPLOY_ID=""
          for attempt in $(seq 1 45); do
            DEPLOY_ID="$(gh run list --repo "$REPO" --workflow deploy.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)"
            if [ -n "$DEPLOY_ID" ]; then break; fi
            sleep 3
          done
          test -n "$DEPLOY_ID" || { echo 'Cannot locate exact-SHA panel deploy'; exit 1; }
          echo "PANEL_DEPLOY_URL=https://github.com/$REPO/actions/runs/$DEPLOY_ID"
          gh run watch "$DEPLOY_ID" --repo "$REPO" --exit-status
          test "$(gh run view "$DEPLOY_ID" --repo "$REPO" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')" = "$SHA:success"
          echo "PANEL_DEV_DEPLOY=PASS API_DEPLOY=SKIPPED LANDING_DEPLOY=SKIPPED"

      - name: Verify actual DEV release and route protection
        run: |
          node <<'NODE'
          (async()=>{
            const origin='https://dev-panel.salon-bw.pl';
            const request=(path)=>fetch(origin+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});
            const meta=await request('/__release.json');
            if(meta.status!==200)throw new Error('Release metadata '+meta.status);
            const data=await meta.json();
            console.log('LIVE_SHA='+data.sha);
            if(data.sha!==process.env.SHA || data.environment!=='development')throw new Error('Unexpected release');
            for(const path of ['/studio-v18/customers/20','/studio-v18/calendar']){
              const r=await request(path);
              const location=r.headers.get('location');
              const next=location?new URL(location,origin).pathname:null;
              console.log(JSON.stringify({path,http:r.status,redirect:next}));
              if (![302,303,307,308].includes(r.status) || next!=='/auth/login')
                throw new Error('Route protection mismatch for '+path);
            }
            console.log('DEV_RELEASE_AND_ROUTE_GUARDS=PASS');
          })().catch(err=>{console.error('Smoke failed: '+String(err.message||err));process.exitCode=1});
          NODE
