name: Calendar owner — time-block integrity gated API DEV

on:
  push:
    branches:
      - fix/calendar-owner-timeblock-integrity-20261110
    paths:
      - '.github/workflows/calendar-owner-timeblock-integrity-staging-20261110.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: salonbw-calendar-owner-timeblock-staging
  cancel-in-progress: false

jobs:
  validate-and-promote-api:
    name: Full CI then API staging only
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment:
      name: staging
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_RELEASE: fc1fbfec73170c09c09e9bc09db314126971a03e
      REVIEWED_FIX_SHA: 606770d9e0237a675d4babae3d73bda2e020c035
      RELEASE_BRANCH: fix/calendar-owner-timeblock-integrity-20261110
      EXPECTED_DEPLOY_BLOB: 7353107936b90dec61772628adad31c02fc7a125
      EXPECTED_SNAPSHOT_BLOB: c20f20856d97692127a16e4d47bcacb7be2cdfdc

    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22 for configuration guards
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail closed for branch, files and snapshot safeguards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gniewkob/salonbw"
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REVIEWED_FIX_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_RELEASE" "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/deploy.yml)" = "$EXPECTED_DEPLOY_BLOB"
          test "$(git rev-parse HEAD:scripts/mydevil/staging-release-snapshot.sh)" = "$EXPECTED_SNAPSHOT_BLOB"

          changed="$(git diff --name-only "$BASE_RELEASE" "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
             .github/workflows/calendar-owner-daily-workflow-uat.yml \
            .github/workflows/calendar-owner-timeblock-integrity-staging-20261110.yml \
            backend/salonbw-backend/src/appointments/appointments.service.ts \
            backend/salonbw-backend/test/calendar-owner-daily-workflow.pg-spec.ts | LC_ALL=C sort)"
          test "$changed" = "$expected"

          result="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow calendar-owner-daily-workflow-uat.yml \
            --commit "$REVIEWED_FIX_SHA" --limit 10 \
            --json headSha,status,conclusion \
            | jq -r --arg sha "$REVIEWED_FIX_SHA" \
                '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length')"
          test "$result" -ge 1
          GITHUB_OUTPUT= DEPLOY_ENV=staging DEPLOY_TARGET=api \
            node scripts/ci/deployment-config.mjs
          echo "REVIEWED_FIX_AND_STAGING_SNAPSHOT=PASS"

      - name: Dispatch standard full CI for exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      - name: Wait for full CI success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CI --event workflow_dispatch \
              --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,headSha,status,conclusion \
              | jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty')"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r '.databaseId' <<<"$run")"
              status="$(jq -r '.status' <<<"$run")"
              outcome="$(jq -r '.conclusion // ""' <<<"$run")"
              if [[ "$status" = "completed" ]]; then
                echo "STANDARD_CI_RUN=$run_id"
                test "$outcome" = "success"
                echo "EXACT_SHA_STANDARD_CI=PASS"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "FULL_CI_BLOCKED: no successful exact SHA" >&2
          exit 1

      - name: Recheck SHA and deploy policy before MyDevil mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq '.sha')" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/deploy.yml)" = "$EXPECTED_DEPLOY_BLOB"
          echo "API_DEV_RELEASE_SCOPE=PASS"

      - name: Deploy API to DEV only; panel and production untouched
        shell: bash
        env:
          DEPLOY_WORKFLOW_REF: fix/calendar-owner-timeblock-integrity-20261110
        run: |
          set -euo pipefail
          scripts/deploy-environment.sh development api "$GITHUB_SHA" --execute

      - name: Record scope
        shell: bash
        run: |
          echo "API_DEV_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "PANEL=UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION=UNTOUCHED" >> "$GITHUB_STEP_SUMMARY"
          echo "OWNER_BUSINESS_UAT=NOT_YET_COMPLETE" >> "$GITHUB_STEP_SUMMARY"
