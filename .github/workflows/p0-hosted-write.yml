name: P0 hosted synthetic booking write gate
on:
  push:
    branches:
      - codex/p0-hosted-write-20261029
    paths:
      - '.github/workflows/p0-hosted-write.yml'
      - 'scripts/ci/p0-hosted-write/**'
permissions:
  contents: read
concurrency:
  group: salonbw-p0-synthetic-booking-once
  cancel-in-progress: false
jobs:
  synthetic-dev-booking:
    if: github.repository == 'gniewkob/salonbw' && github.ref == 'refs/heads/codex/p0-hosted-write-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      deployment: false
    env:
      DEV_ACCESS_USER: ${{ secrets.DEV_ACCESS_USER }}
      DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      P0_DEV_PRECHECK: verified-on-host
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact source and staging credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEV_ACCESS_USER" == "uat" && -n "$DEV_ACCESS_PASSWORD" && -n "$E2E_ADMIN_PASSWORD" ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/ci/p0-hosted-write/booking.mjs
          node --check scripts/ci/p0-hosted-write/preflight.cjs
      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          SSH_FALLBACK: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          key="$SSH_KEY"
          if [[ -z "$key" ]]; then key="$SSH_FALLBACK"; fi
          [[ -n "$key" && -n "$SSH_KNOWN" ]] || {
            echo "::error::Missing SSH key or pinned host key for guarded DEV writes"
            exit 2
          }
          if [[ "$key" == *"-----BEGIN "* ]]; then
            printf '%s' "$key" | tr -d '\r' > ~/.ssh/mydevil
          else
            printf '%s' "$key" | tr -d '\r' | base64 -d > ~/.ssh/mydevil
          fi
          chmod 600 ~/.ssh/mydevil
          printf '%s\n' "$SSH_KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only DB identity and zero outbound proof (host)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mydevil -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vetternkraft@s0.mydevil.net \
            'cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev && node22 -' \
            < scripts/ci/p0-hosted-write/preflight.cjs
      - name: Full synthetic client registration, booking, 403, 409, persistence and cancellation
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node scripts/ci/p0-hosted-write/booking.mjs
