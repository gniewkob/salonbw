name: V18 Communication — hosted DEV audit UAT

on:
  push:
    branches:
      - test/v18-communication-hosted-dev-uat-20261109
    paths:
      - 'apps/panel/uat/hosted-dev-communication.pw.ts'
      - 'apps/panel/uat/tsconfig.communication.json'
      - 'apps/panel/playwright.hosted-dev-communication.config.ts'
      - '.github/workflows/v18-communication-hosted-dev-uat.yml'

permissions:
  contents: read

concurrency:
  group: salonbw-v18-hosted-communication-uat
  cancel-in-progress: false

jobs:
  hosted-communication:
    name: Hosted DEV communication (synthetic + cleanup)
    if: github.ref == 'refs/heads/test/v18-communication-hosted-dev-uat-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      deployment: false
    env:
      CI: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_VERSION: '22'
      PNPM_VERSION: '10.14.0'
      PLAYWRIGHT_BASE_URL: https://dev-panel.salon-bw.pl

    steps:
      - name: Checkout exact tested source (no persisted credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate immutable ancestry and exact hosted target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/test/v18-communication-hosted-dev-uat-20261109'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0c6832de6c29f2d68ce6874a1b1308860ca02eab HEAD
          test "$PLAYWRIGHT_BASE_URL" = 'https://dev-panel.salon-bw.pl'
          test -f scripts/ci/e2e-dev-only/preflight.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '${{ env.PNPM_VERSION }}'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck guarded browser suite without credentials
        run: |
          pnpm --dir apps/panel exec tsc --project uat/tsconfig.communication.json --noEmit
          pnpm --dir apps/panel exec playwright test \
            --config=playwright.hosted-dev-communication.config.ts --list

      - name: Verify isolated MyDevil DEV database and outbound disabled
        shell: bash
        env:
          SSH_KEY: '${{ secrets.MYDEVIL_SSH_KEY }}'
          SSH_FALLBACK: '${{ secrets.SSH_PRIVATE_KEY }}'
          SSH_KNOWN: '${{ secrets.MYDEVIL_KNOWN_HOSTS }}'
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p ~/.ssh
          key="$SSH_KEY"
          if [ -z "$key" ]; then key="$SSH_FALLBACK"; fi
          test -n "$key" && test -n "$SSH_KNOWN"
          if [[ "$key" == *"-----BEGIN "* ]]; then
            printf "%s" "$key" | tr -d '\r' > ~/.ssh/communication-uat
          else
            printf "%s" "$key" | tr -d '\r' | base64 -d > ~/.ssh/communication-uat
          fi
          chmod 600 ~/.ssh/communication-uat
          printf '%s\n' "$SSH_KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/communication-uat -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            vetternkraft@s0.mydevil.net \
            'cd /usr/home/vetternkraft/apps/nodejs/api_salonbw_dev && node22 -' \
            < scripts/ci/e2e-dev-only/preflight.cjs

      - name: Install Chromium for hosted test
        run: pnpm --dir apps/panel exec playwright install chromium --with-deps

      - name: Verify hosted releases and run synthetic communication UAT
        shell: bash
        env:
          DEV_ACCESS_USER: '${{ secrets.DEV_ACCESS_USER }}'
          DEV_ACCESS_PASSWORD: '${{ secrets.DEV_ACCESS_PASSWORD }}'
          E2E_ADMIN_EMAIL: stylist@salonbw.example.test
          E2E_ADMIN_PASSWORD: '${{ secrets.E2E_ADMIN_PASSWORD }}'
          COMMUNICATION_DEV_TEST_ACK: SYNTHETIC_ONLY
        run: |
          set -euo pipefail
          set +x
          test "$DEV_ACCESS_USER" = 'uat' && test -n "$DEV_ACCESS_PASSWORD" && test -n "$E2E_ADMIN_PASSWORD"
          pnpm --dir apps/panel exec playwright test \
            --config=playwright.hosted-dev-communication.config.ts \
            --project=hosted-dev-communication \
            --workers=1 --retries=0 --reporter=list

      # No artifact upload: authenticated sessions and real DEV headers are private.
