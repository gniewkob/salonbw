auditConfig:
  ignoreCves:
    - CVE-2023-30533
    - CVE-2024-22363
    # braces <=3.0.3 stack-exhaustion DoS (GHSA-vfj7-8cjw-p6xm). No fixed
    # release exists: 3.0.3 is the latest braces, and micromatch 4.0.8 (also
    # latest) requires it. Reached only through dev tooling (jest, eslint-config-
    # next, lint-staged) - `pnpm why braces -r --prod` finds it 0 times, so it
    # never ships. Drop this entry once braces publishes a fix.
    - CVE-2026-93687
    # zod <4.6.6 memory exhaustion on large arrays (GHSA-mrhx-c7xc-m3w5). Only
    # reached via jimp>@jimp/plugin-blit, which pins zod ^3 even in its latest
    # release, and 3.x has no fix. jimp validates its own method options, never
    # request data: our only call is Jimp.read(uploadedBuffer).scaleToFit() for
    # customer-media thumbnails. Owner-approved exception 2026-10-24; drop it
    # once jimp moves to zod 4.
    - CVE-2023-54404
