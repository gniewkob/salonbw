# Reviewed non-secret immutable Git object IDs used to pin V18 test and
# promotion source. All three criteria must match: originating commit, exact
# workflow path, and exact pinned SHA text. Do NOT exempt entire commits or
# paths: this preserves detection of unrelated secrets in those files.
[[allowlists]]
description = "V18 pinned Git SHA identifiers — reviewed generic-api-key false positives"
condition = "AND"
# Gitleaks v8.24 defaults to matching the extracted Secret; do not set regexTarget.
